version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # every github/codeql-action step in a workflow must run the same version
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
